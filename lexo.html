<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lexo — Pirro Thomo</title>
<link rel="stylesheet" href="assets/site.css">

<!-- reader.js only discovers pdf.min.mjs (328 KB) when it runs, a round trip
     into the page. Start it with the HTML instead; the request log confirms it
     is still fetched exactly once.
     The 1.3 MB worker cannot be started early the same way: warming it with
     fetch() and handing pdf.js a pre-built Worker via workerPort were both
     tried, and each time pdf.js requested the file again, so 1.3 MB came down
     twice. Leave the worker to pdf.js. -->
<link rel="modulepreload" href="vendor/pdfjs/pdf.min.mjs">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; background: var(--paper-2); }

  .rbar {
    display: flex; align-items: center; gap: 1rem;
    padding: .55rem 1rem; border-bottom: 1px solid var(--rule);
    background: var(--paper); flex: 0 0 auto; flex-wrap: wrap;
  }
  .rbar .title {
    font-size: .95rem; font-weight: 500; margin: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex: 1 1 8rem; min-width: 0;
  }
  .rbar .group { display: flex; align-items: center; gap: .35rem; }
  .rbar .btn { padding: .32rem .6rem; font-size: .78rem; }
  .icon-btn {
    width: 2rem; height: 2rem; display: inline-flex; align-items: center;
    justify-content: center; padding: 0; font-size: 1rem; line-height: 1;
  }
  .pager {
    font-family: var(--sans); font-size: .8rem; color: var(--ink-faint);
    display: flex; align-items: center; gap: .3rem; white-space: nowrap;
  }
  .pager input {
    width: 3.6rem; font: inherit; text-align: right; padding: .25rem .35rem;
    border: 1px solid var(--rule); border-radius: 3px;
    background: var(--paper); color: var(--ink);
  }

  #viewer {
    flex: 1 1 auto; overflow-y: auto; overflow-x: auto;
    display: flex; flex-direction: column; align-items: center;
    gap: 1.25rem; padding: 1.25rem 0 4rem;
    scroll-behavior: smooth; overscroll-behavior: contain;
  }
  .pg {
    position: relative; background: #fff; box-shadow: var(--shadow);
    flex: 0 0 auto; border-radius: 1px;
  }
  @media (prefers-color-scheme: dark) { .pg { background: #ddd8d0; } }
  .pg canvas { display: block; border-radius: 1px; }

  /* Selectable text sits invisibly on top of the rendered page. */
  .textLayer {
    position: absolute; inset: 0; overflow: hidden; line-height: 1;
    text-size-adjust: none; forced-color-adjust: none;
    transform-origin: 0 0; z-index: 2; caret-color: CanvasText;
  }
  .textLayer :is(span, br) {
    color: transparent; position: absolute; white-space: pre;
    cursor: text; transform-origin: 0 0;
  }
  .textLayer span.markedContent { top: 0; height: 0; }
  .textLayer ::selection { background: rgba(140, 32, 39, .32); }
  .textLayer br::selection { background: transparent; }
  .pg-num { z-index: 3; }
  .pg-num {
    position: absolute; bottom: -1.05rem; right: .1rem;
    font-family: var(--sans); font-size: .68rem; color: var(--ink-faint);
  }

  #status {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1rem;
    font-family: var(--sans); font-size: .9rem; color: var(--ink-faint);
    pointer-events: none;
  }
  #status button { pointer-events: auto; }
  .stage { position: relative; flex: 1 1 auto; display: flex; min-height: 0; }

  @media (max-width: 34rem) {
    .rbar { gap: .5rem; padding: .5rem .6rem; }
    .rbar .title { flex-basis: 100%; order: -1; }
  }
</style>
</head>
<body>

<div class="rbar">
  <a id="back" class="btn icon-btn" href="./" title="Kthehu" aria-label="Kthehu">&#8592;</a>
  <p class="title" id="book-title"></p>

  <span class="pager">
    <input id="page-in" type="number" min="1" value="1" aria-label="Faqja">
    <span>/ <b id="page-tot">–</b></span>
  </span>

  <span class="group">
    <button class="btn icon-btn" id="zoom-out" title="Zvogëllo" aria-label="Zvogëllo">&#8722;</button>
    <button class="btn icon-btn" id="zoom-fit" title="Përshtat gjerësinë" aria-label="Përshtat gjerësinë">&#9633;</button>
    <button class="btn icon-btn" id="zoom-in" title="Zmadho" aria-label="Zmadho">&#43;</button>
  </span>

  <a class="btn" id="dl" href="#">Shkarko</a>
  <span hidden id="page-now">1</span>
</div>

<div class="stage">
  <div id="viewer"></div>
  <div id="status" hidden></div>
</div>

<script type="module" src="assets/reader.js"></script>
</body>
</html>
